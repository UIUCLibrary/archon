# Archon test environment: PHP 8.2 (PHP-FPM) + SQL Server 2022, one Archon site per production install.
# The host's Apache httpd is the web server (httpd/archon-testenv.conf forwards to PHP-FPM on 127.0.0.1:9000).
#
#   cd tests/testenv && podman compose up -d        (or podman-compose up -d, or docker compose up -d)
#
# Works with Podman (podman compose / podman-compose, rootful or rootless) and Docker Compose v2. Image names
# are fully qualified so that Podman's short-name policy never has to prompt.
# Sites: http://<host>/archives/ /ihlc/ /rbml/ /ala/ (index of sites at http://<host>/archon-testenv/).
# Each site restores backups/<site>.bak when present, otherwise it is installed with synthetic sample data.
# Settings come from an optional .env file next to this file (see env.example). See README.md.
name: archon-testenv

services:
  mssql:
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_COLLATION: ${MSSQL_COLLATION:-SQL_Latin1_General_CP1_CI_AS}
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-2048}
    # The SA password is generated by the php container on first start (or taken from MSSQL_SA_PASSWORD
    # in .env) and shared through the "secrets" volume, so nothing has to be configured up front.
    entrypoint:
      - /bin/bash
      - -c
      - |
        secret=/run/archon-secrets/mssql-sa
        for i in $$(seq 1 900); do [ -s "$$secret" ] && break; sleep 1; done
        if [ ! -s "$$secret" ]; then echo "mssql: the php container did not create $$secret" >&2; exit 1; fi
        export MSSQL_SA_PASSWORD="$$(cat "$$secret")"
        exec /opt/mssql/bin/launch_sqlservr.sh /opt/mssql/bin/sqlservr
    volumes:
      - mssql-data:/var/opt/mssql
      - secrets:/run/archon-secrets:ro
      - backup-staging:/archon/staging:ro
      - ./backups:/archon/backups:ro,z
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$(cat /run/archon-secrets/mssql-sa)\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  php:
    image: ${ARCHON_IMAGE:-localhost/archon-testenv/php:8.2-fpm}
    build:
      context: ../..
      dockerfile: tests/docker/php/Dockerfile
      args:
        PHP_VARIANT: fpm
    depends_on:
      - mssql
    environment:
      ARCHON_SITES: ${ARCHON_SITES:-archives ihlc rbml ala}
      ARCHON_SAMPLE_SIZE: ${ARCHON_SAMPLE_SIZE:-standard}
      ARCHON_ADMIN_LOGIN: ${ARCHON_ADMIN_LOGIN:-testadmin}
      ARCHON_ADMIN_PASSWORD: ${ARCHON_ADMIN_PASSWORD:-}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-}
      ARCHON_PUBLIC_URL: ${ARCHON_PUBLIC_URL:-http://localhost}
    volumes:
      - secrets:/run/archon-secrets
      - backup-staging:/archon/staging
      - ./backups:/archon/backups:ro,z
      - logs:/var/log/archon
    ports:
      # FastCGI for the host's Apache httpd. FastCGI runs any PHP code it is sent: never publish it
      # beyond the loopback interface.
      - "${ARCHON_FPM_BIND:-127.0.0.1}:${ARCHON_FPM_PORT:-9000}:9000"
    healthcheck:
      # Healthy once every site has been initialised (first start: a few minutes; large restores: longer)
      # and PHP-FPM accepts connections.
      test: ["CMD-SHELL", "test -f /run/archon/ready && php -n -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60m
    restart: unless-stopped

volumes:
  mssql-data:
  secrets:
  backup-staging:
  logs:
