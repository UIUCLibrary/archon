# Archon test environment: the host's Apache httpd in front of the PHP-FPM container.
#
# Install (Rocky Linux; see tests/testenv/README.md):
#   sudo cp archon-testenv.conf /etc/httpd/conf.d/
#   sudo apachectl configtest && sudo systemctl reload httpd
#
# The file applies to the main server and is inherited by every virtual host, including the
# TLS one from mod_ssl. To limit it to one virtual host, Include it inside that <VirtualHost>.
#
# Keep in step with tests/testenv/.env:
#   - the site list (archives|ihlc|rbml|ala) must match ARCHON_SITES
#   - 127.0.0.1:9000 must match ARCHON_FPM_BIND:ARCHON_FPM_PORT
#
# Requires mod_proxy, mod_proxy_fcgi and mod_alias. Rocky Linux loads all three by default
# (/etc/httpd/conf.modules.d/00-proxy.conf and 00-base.conf).

<IfModule !proxy_fcgi_module>
    Error "archon-testenv.conf needs mod_proxy_fcgi (LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so)"
</IfModule>

# /archives -> /archives/
RedirectMatch 301 "^/(archives|ihlc|rbml|ala)$" "/$1/"

# Directories run their index.php (the site root, /<site>/admin/, ...).
ProxyPassMatch "^/(archives|ihlc|rbml|ala)/((?:[^/]+/)*)$" "fcgi://127.0.0.1:9000/var/www/html/$1/$2index.php" timeout=900 retry=0

# PHP scripts run in the container, at the same path under /var/www/html.
ProxyPassMatch "^/(archives|ihlc|rbml|ala)/(.+\.php)$" "fcgi://127.0.0.1:9000/var/www/html/$1/$2" timeout=900 retry=0

# Everything else (theme images, style sheets, JavaScript) is served from the container's copy of the code.
ProxyPassMatch "^/(archives|ihlc|rbml|ala)/(.+)$" "fcgi://127.0.0.1:9000/usr/local/lib/archon/static.php/$1/$2" timeout=900 retry=0

# Index of the test sites, with their data source (sample data or restored backup).
ProxyPassMatch "^/archon-testenv/?$" "fcgi://127.0.0.1:9000/usr/local/lib/archon/static.php/archon-testenv" timeout=900 retry=0

# Pass the Authorization header to PHP-FPM. Archon's JSON API (?p=core/authenticate), which
# archon-migration and tests/migration-api use, logs in with HTTP Basic authentication.
<LocationMatch "^/(archives|ihlc|rbml|ala)/">
    CGIPassAuth On
</LocationMatch>
