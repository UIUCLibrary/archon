# Archon PHP 8.2 test environment. Normally driven by tests/bin/archon-test.
#
#   php82  - PHP 8.2 + Apache (target runtime)   http://127.0.0.1:8082/<site>/
#   mssql  - SQL Server 2022 (Developer edition)
#
# Credentials are throwaway values generated into tests/docker/.env by tests/bin/archon-test.
# Images are built with `tests/bin/archon-test build` (docker build --network host), not by compose.
name: archon-test

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${ARCHON_TEST_MSSQL_SECRET:?run tests/bin/archon-test env first}
      MSSQL_COLLATION: ${ARCHON_TEST_MSSQL_COLLATION:-SQL_Latin1_General_CP1_CI_AS}
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 10s
      retries: 60
    ports:
      - "127.0.0.1:14330:1433"

  php82:
    image: archon-test/php:8.2
    environment:
      ARCHON_TEST_MSSQL_HOST: mssql
      ARCHON_TEST_MSSQL_USER: sa
      ARCHON_TEST_MSSQL_SECRET: ${ARCHON_TEST_MSSQL_SECRET:?run tests/bin/archon-test env first}
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ../..:/src:ro
      - ./artifacts/php82:/var/log/archon
    ports:
      - "127.0.0.1:8082:80"
