# Apache httpd settings for the Archon image's apache variant (docker-compose.yml and
# docker-compose-traefik.yml at the repository root). Each Archon site lives in /var/www/html/<site>.
# The virtual host below replaces Debian's 000-default site.

ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.php index.html
</Directory>

# Dotfiles (.git, .env, .htaccess) and database backups are never served.
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
<FilesMatch "\.(bak|sql)$">
    Require all denied
</FilesMatch>
# Configuration, libraries and templates (config.inc.php, packages/*/lib, packages/*/templates, themes) are
# only ever included by index.php; requested directly they would run out of context.
<FilesMatch "\.inc\.php$">
    Require all denied
</FilesMatch>

# The index of sites is /index.html (written by archon-testenv). /archon-testenv/ is its address in the
# Podman environment behind the host's Apache httpd.
RedirectMatch 302 "^/archon-testenv/?$" "/"

# Behind a reverse proxy, mod_remoteip replaces the proxy's address with the client's from X-Forwarded-For,
# for Archon's session address check and admin IP restriction (see archon-proxy.conf). Log the result.
LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" combined

<VirtualHost *:80>
    DocumentRoot /var/www/html
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    # Written by archon-entrypoint at start-up from ARCHON_TRUSTED_PROXIES: client address and HTTPS=on for
    # requests that the reverse proxy received over https.
    IncludeOptional /etc/apache2/archon-proxy.conf
    # Apache builds its own redirects (mod_dir: /archives -> /archives/; RedirectMatch above) as http://.
    # Behind the proxy (HTTPS=on) these rules send the https address instead. Archon's own redirects are
    # relative. (ServerName https://... would also do it, but it sets SERVER_PORT=443 for every request,
    # and Archon's isSecureConnection() trusts that even for plain http.)
    RewriteEngine On
    RewriteCond %{ENV:HTTPS} =on
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -d
    RewriteRule "^(.*[^/])$" "https://%{HTTP_HOST}$1/" [R=301,L]
    RewriteCond %{ENV:HTTPS} =on
    RewriteRule "^/archon-testenv/?$" "https://%{HTTP_HOST}/" [R=302,L]
</VirtualHost>
