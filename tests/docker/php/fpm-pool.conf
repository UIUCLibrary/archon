; PHP-FPM pool settings for the Archon test environment (fpm image variant). The base image's
; zz-docker.conf already sets "listen = 9000" and runs the master process in the foreground.
[www]
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
; Long staff-interface operations (imports, exports); the host Apache proxy timeout is 900 s as well.
request_terminate_timeout = 900s
catch_workers_output = yes
decorate_workers_output = no
; Only PHP scripts are executed; static files go through /usr/local/lib/archon/static.php.
security.limit_extensions = .php
