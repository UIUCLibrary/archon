; Archon test image PHP settings (production-like, but logs everything).
error_reporting = E_ALL
display_errors = Off
display_startup_errors = On
log_errors = On
error_log = /var/log/archon/php_errors.log
; Records every diagnostic, including those hidden by Archon's own error_reporting() call.
auto_prepend_file = /usr/local/lib/archon-test/error-capture.php

; php.ini-production defaults that differ from PHP's built-in defaults.
short_open_tag = Off
; php2shell (CVE-2026-109619) defence in depth: Archon never uses upload progress tracking.
session.upload_progress.enabled = 0
; Session cookie hardening. Archon's session_set_cookie_params() call omits these, and PHP 8 keeps the ini values
; (PHP 5.4 forced HttpOnly off). No Archon JavaScript reads the "archon" cookie.
session.cookie_httponly = 1
session.cookie_samesite = Lax

memory_limit = 512M
max_execution_time = 300
upload_max_filesize = 32M
post_max_size = 32M
date.timezone = America/Chicago
