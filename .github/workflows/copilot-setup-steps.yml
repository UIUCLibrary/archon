name: "Copilot Setup Steps"

# Pre-builds the PHP 8.2 + SQL Server 2022 test environment (tests/docker) so the
# Copilot cloud agent starts with the images built and the containers running.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - tests/docker/**
      - tests/bin/archon-test
      - tests/testenv/**
      - tests/sample-data/**
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - tests/docker/**
      - tests/bin/archon-test
      - tests/testenv/**
      - tests/sample-data/**

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Pull SQL Server 2022 image
        run: docker pull mcr.microsoft.com/mssql/server:2022-latest

      - name: Generate test environment file
        run: tests/bin/archon-test env

      - name: Build PHP 8.2 image
        run: tests/bin/archon-test build

      - name: Start containers
        run: tests/bin/archon-test up

      # Installs a fresh Archon database through the real web installer (about 30 seconds).
      # A failure here should not prevent the agent from starting with the images built.
      - name: Install Archon into the test database
        continue-on-error: true
        run: tests/bin/archon-test install --no-fixtures
