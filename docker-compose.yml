# Archon (PHP 8.2) + SQL Server 2022 in containers, with Apache httpd inside the Archon container.
#
#   docker compose up -d                 (or: podman compose up -d)
#   docker compose logs -f php           until "Archon test environment (PHP 8.2...) is ready"
#   http://localhost:8080/               index of sites; /archives/ /ihlc/ /rbml/ /ala/
#
# docker-compose-traefik.yml runs the same containers behind the Traefik reverse proxy instead of a published
# port. tests/testenv/compose.yaml is the variant for a host whose own Apache httpd serves the sites.
# Each site restores tests/testenv/backups/<site>.bak when present, otherwise it is filled with synthetic sample
# data shaped after the UIUC instances. Settings: optional .env next to this file (see docker.env.example).
# See README.docker.md.
name: archon

services:
  mssql:
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-latest}
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_COLLATION: ${MSSQL_COLLATION:-SQL_Latin1_General_CP1_CI_AS}
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-2048}
    # The SA password is generated by the php container on first start (or taken from MSSQL_SA_PASSWORD
    # in .env) and shared through the "secrets" volume.
    entrypoint:
      - /bin/bash
      - -c
      - |
        secret=/run/archon-secrets/mssql-sa
        [ -s "$$secret" ] || echo "mssql: waiting for the php container to create $$secret"
        for i in $$(seq 1 900); do [ -s "$$secret" ] && break; sleep 1; done
        if [ ! -s "$$secret" ]; then echo "mssql: the php container did not create $$secret" >&2; exit 1; fi
        export MSSQL_SA_PASSWORD="$$(cat "$$secret")"
        exec /opt/mssql/bin/launch_sqlservr.sh /opt/mssql/bin/sqlservr
    volumes:
      - mssql-data:/var/opt/mssql
      - secrets:/run/archon-secrets:ro
      - backup-staging:/archon/staging:ro
      - ${ARCHON_BACKUPS_DIR:-./tests/testenv/backups}:/archon/backups:ro,z
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$(cat /run/archon-secrets/mssql-sa)\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  php:
    image: ${ARCHON_IMAGE:-localhost/archon/php:8.2-apache}
    # Built locally, never pulled ("up -d --build" rebuilds it).
    pull_policy: never
    build:
      context: .
      dockerfile: tests/docker/php/Dockerfile
      args:
        PHP_VARIANT: apache
    depends_on:
      - mssql
    environment:
      ARCHON_SITES: ${ARCHON_SITES:-archives ihlc rbml ala}
      ARCHON_SAMPLE_SIZE: ${ARCHON_SAMPLE_SIZE:-standard}
      ARCHON_ADMIN_LOGIN: ${ARCHON_ADMIN_LOGIN:-testadmin}
      ARCHON_ADMIN_PASSWORD: ${ARCHON_ADMIN_PASSWORD:-}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-}
      ARCHON_PUBLIC_URL: ${ARCHON_PUBLIC_URL:-http://localhost:8080}
      # Addresses of a reverse proxy in front of the published port, if any (see README.docker.md).
      ARCHON_TRUSTED_PROXIES: ${ARCHON_TRUSTED_PROXIES:-}
      # 1: a page that ends with a fatal PHP error shows the error (production shows an empty HTTP 500).
      ARCHON_SHOW_ERRORS: ${ARCHON_SHOW_ERRORS:-1}
    volumes:
      - secrets:/run/archon-secrets
      - backup-staging:/archon/staging
      - ${ARCHON_BACKUPS_DIR:-./tests/testenv/backups}:/archon/backups:ro,z
      - logs:/var/log/archon
    ports:
      # Loopback only by default: the sample sites have a known staff login. ARCHON_HTTP_BIND=0.0.0.0 publishes it.
      - "${ARCHON_HTTP_BIND:-127.0.0.1}:${ARCHON_HTTP_PORT:-8080}:80"
    healthcheck:
      # Healthy once every site has been initialised and Apache answers.
      test: ["CMD-SHELL", "test -f /run/archon/ready && php -n -r 'exit(@fsockopen(\"127.0.0.1\", 80) ? 0 : 1);'"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60m
    restart: unless-stopped

volumes:
  mssql-data:
  secrets:
  backup-staging:
  logs:
